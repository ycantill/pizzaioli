<div class="dialog-header">
  <button type="button" class="dialog-close" aria-label="Cerrar" (click)="onCancel()">
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
  <h2 mat-dialog-title>Paquetería de {{ data.recipeType.name }}</h2>
</div>
<mat-dialog-content>
  <form [formGroup]="form">
    <h3 class="section-title">Qué se empaca</h3>

    <ul formArrayName="items" class="items-list">
      @for (item of itemsArray.controls; track $index) {
        <li [formGroupName]="$index" class="item-row">
          <label class="field item-supply">
            <span class="field-label">Insumo</span>
            <span class="field-line">
              <select class="field-select" formControlName="supplyId">
                @for (cost of availableCosts($index); track cost.id) {
                  <option [value]="cost.id">{{ cost.name }}</option>
                }
              </select>
            </span>
          </label>

          <label class="field item-quantity">
            <span class="field-label">Cantidad</span>
            <span class="field-line">
              <input class="field-input" type="number" min="1" step="1" inputmode="numeric"
                     formControlName="quantity">
            </span>
          </label>

          <button type="button"
                  class="item-remove"
                  [disabled]="itemsArray.length === 1"
                  [attr.aria-label]="'Quitar ítem ' + ($index + 1)"
                  (click)="removeItem($index)">
            <mat-icon aria-hidden="true">delete</mat-icon>
          </button>
        </li>
      }
    </ul>

    <button type="button" class="add-line" (click)="addItem()">
      <mat-icon aria-hidden="true">add</mat-icon>
      Agregar ítem
    </button>

    @if (data.packaging) {
      <div class="danger-zone">
        <button type="button" class="button-outline is-destructive" (click)="onDelete()">
          <mat-icon aria-hidden="true">delete</mat-icon>
          Eliminar paquetería
        </button>
      </div>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" class="button-plain" (click)="onCancel()">Cancelar</button>
  <button type="button" class="button-stamp" [disabled]="!form.valid" (click)="onSave()">
    Guardar
  </button>
</mat-dialog-actions>
