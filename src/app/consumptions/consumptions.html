<div class="page-header">
  <h1 class="page-title">Consumos</h1>
</div>

<div class="container">
  <p class="intro">
    Cuánto gasta por hora cada tarea: gas del horno, tiempo de una persona. La mano de obra de cada
    receta se arma con estos.
  </p>

  @if (loading()) {
    <div class="loading-container">
      <mat-spinner></mat-spinner>
    </div>
  } @else {
    <button type="button" class="add-line" (click)="addConsumption()">
      <mat-icon aria-hidden="true">add</mat-icon>
      Nuevo consumo
    </button>

    <ul class="consumption-list">
      @for (consumption of consumptions(); track consumption.id) {
        <li>
          <button type="button"
                  class="consumption-row"
                  [attr.aria-label]="'Editar consumo ' + consumption.name"
                  (click)="editConsumption(consumption)">
            <span class="row-head">
              <span class="ticket-name">{{ consumption.name }}</span>
              <span class="ticket-leader" aria-hidden="true"></span>
              <span class="ticket-value">
                {{ consumption.quantity | number }}<span
                  class="ticket-unit">{{ unitAbbr(consumption.rateId) }}/h</span>
              </span>
            </span>
            <span class="row-service">{{ getCostName(consumption.rateId) }}</span>
          </button>
        </li>
      } @empty {
        <p class="empty">No hay consumos registrados.</p>
      }
    </ul>
  }
</div>
