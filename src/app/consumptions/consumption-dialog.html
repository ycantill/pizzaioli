<div class="dialog-header">
  <button type="button" class="dialog-close" aria-label="Cerrar" (click)="onCancel()">
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
  <h2 mat-dialog-title>{{ data.consumption ? 'Editar' : 'Nuevo' }} consumo</h2>
</div>
<mat-dialog-content>
  <form [formGroup]="form">
    <label class="field">
      <span class="field-label">Nombre</span>
      <span class="field-line">
        <input class="field-input" type="text" formControlName="name"
               placeholder="Ej: Preparación de masa">
      </span>
      @if (showError('name', 'required')) {
        <span class="field-error">El nombre es requerido</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Servicio</span>
      <span class="field-line">
        <select class="field-select" formControlName="rateId" (change)="onCostChange()">
          <option value="" disabled>Elegí un servicio</option>
          @for (cost of data.costs; track cost.id) {
            <option [value]="cost.id">{{ cost.name }}</option>
          }
        </select>
      </span>
      @if (showError('rateId', 'required')) {
        <span class="field-error">El servicio es requerido</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Consumo en 1 hora{{ getUnitLabel() }}</span>
      <span class="field-line">
        <input class="field-input" type="number" min="0.1" step="0.1" inputmode="decimal"
               formControlName="quantity">
      </span>
      @if (showError('quantity', 'required')) {
        <span class="field-error">La cantidad es requerida</span>
      }
      @if (showError('quantity', 'min')) {
        <span class="field-error">La cantidad debe ser mayor a 0</span>
      }
    </label>

    @if (data.consumption) {
      <div class="danger-zone">
        <button type="button" class="button-outline is-destructive" (click)="onDelete()">
          <mat-icon aria-hidden="true">delete</mat-icon>
          Eliminar consumo
        </button>
      </div>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" class="button-plain" (click)="onCancel()">Cancelar</button>
  <button type="button" class="button-stamp" [disabled]="!form.valid" (click)="onSave()">
    {{ data.consumption ? 'Guardar' : 'Crear' }}
  </button>
</mat-dialog-actions>
