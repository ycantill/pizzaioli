<div class="dialog-header">
  <button type="button" class="dialog-close" aria-label="Cerrar" (click)="onCancel()">
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
  <h2 mat-dialog-title>{{ data.category ? 'Editar' : 'Nueva' }} categoría</h2>
</div>
<mat-dialog-content>
  <form [formGroup]="form">
    <label class="field">
      <span class="field-label">Nombre</span>
      <span class="field-line">
        <input class="field-input" type="text" formControlName="name" placeholder="Ej: Lácteos">
      </span>
      @if (showError('name', 'required')) {
        <span class="field-error">El nombre es requerido</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Función</span>
      <span class="field-line">
        <select class="field-select" formControlName="kind">
          <option value="ingrediente">Ingrediente</option>
          <option value="paqueteria">Paquetería</option>
        </select>
      </span>
      <span class="field-hint">
        Los ingredientes se ofrecen en masas y toppings; la paquetería, en empaque
      </span>
    </label>

    @if (data.category) {
      <div class="danger-zone">
        <button type="button" class="button-outline is-destructive" (click)="onDelete()">
          <mat-icon aria-hidden="true">delete</mat-icon>
          Eliminar categoría
        </button>
      </div>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" class="button-plain" (click)="onCancel()">Cancelar</button>
  <button type="button" class="button-stamp" [disabled]="!form.valid" (click)="onSave()">
    {{ data.category ? 'Guardar' : 'Crear' }}
  </button>
</mat-dialog-actions>
