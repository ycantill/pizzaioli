<h2 mat-dialog-title>{{ data.category ? 'Editar' : 'Nueva' }} categoría</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" placeholder="Ej: Lácteos">
      @if (form.get('name')?.hasError('required')) {
        <mat-error>El nombre es requerido</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Función</mat-label>
      <mat-select formControlName="kind">
        <mat-option value="ingrediente">Ingrediente</mat-option>
        <mat-option value="paqueteria">Paquetería</mat-option>
      </mat-select>
      <mat-hint>Los ingredientes se ofrecen en masas y toppings; la paquetería, en empaque</mat-hint>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-flat-button color="primary"
          (click)="onSave()"
          [disabled]="!form.valid">
    {{ data.category ? 'Guardar' : 'Crear' }}
  </button>
</mat-dialog-actions>
