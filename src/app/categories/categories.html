<div class="page-header">
  <h1 class="page-title">Categorías de insumo</h1>
</div>

<div class="container">
  <p class="intro">
    Agrupan los insumos y deciden dónde se ofrecen: los ingredientes aparecen en masas y toppings;
    la paquetería, en empaque.
  </p>

  @if (loading()) {
    <div class="loading-container">
      <mat-spinner></mat-spinner>
    </div>
  } @else {
    <button type="button" class="add-line" (click)="addCategory()">
      <mat-icon aria-hidden="true">add</mat-icon>
      Nueva categoría
    </button>

    <ul class="category-list">
      @for (category of categories(); track category.id) {
        <li>
          <button type="button"
                  class="category-row"
                  [attr.aria-label]="'Editar categoría ' + category.name"
                  (click)="editCategory(category)">
            <span class="ticket-name">{{ category.name }}</span>
            <span class="ticket-leader" aria-hidden="true"></span>
            <span class="ticket-tag">{{ kindLabel(category) }}</span>
          </button>
        </li>
      } @empty {
        <p class="empty">No hay categorías registradas.</p>
      }
    </ul>
  }
</div>
