<div class="dialog-header">
  <button type="button" class="dialog-close" aria-label="Cerrar" (click)="onCancel()">
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
  <h2 mat-dialog-title>{{ data.rate ? 'Editar' : 'Nueva' }} tarifa</h2>
</div>
<mat-dialog-content>
  <form [formGroup]="form">
    <label class="field">
      <span class="field-label">Nombre</span>
      <span class="field-line">
        <input class="field-input" type="text" formControlName="name"
               placeholder="Ej: Energía eléctrica">
      </span>
      @if (showError('name', 'required')) {
        <span class="field-error">El nombre es requerido</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Unidad</span>
      <span class="field-line">
        <select class="field-select" formControlName="unitId">
          <option value="" disabled>Elegí una unidad</option>
          @for (unit of data.units; track unit.id) {
            <option [value]="unit.id">{{ unit.name }}</option>
          }
        </select>
      </span>
      @if (showError('unitId', 'required')) {
        <span class="field-error">La unidad es requerida</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Valor por unidad</span>
      <span class="field-line">
        <span class="field-prefix">$</span>
        <input class="field-input" type="number" min="0" step="any" inputmode="decimal"
               formControlName="value">
      </span>
      @if (showError('value', 'required')) {
        <span class="field-error">El valor es requerido</span>
      }
      @if (showError('value', 'min')) {
        <span class="field-error">El valor no puede ser negativo</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Consumo por hora</span>
      <span class="field-line">
        <input class="field-input" type="number" min="0" step="any" inputmode="decimal"
               formControlName="quantityPerHour">
        <span class="field-suffix">{{ unitAbbreviation() }}/h</span>
      </span>
      <span class="field-hint">
        Cuánto gasta por cada hora de uso: un horno puede quemar 2 m³ de gas por hora. Para la
        mano de obra, que ya se cobra por hora, es 1.
      </span>
    </label>

    <p class="field-hint">
      Las tarifas no llevan inventario: su valor se mantiene a mano. Cambiarlo mueve de inmediato
      los precios que dependan de ella.
    </p>

    <app-margin-fields [group]="marginGroup" [total]="marginTotal()" />

    @if (data.rate) {
      <div class="danger-zone">
        <button type="button" class="button-outline is-destructive" (click)="onDelete()">
          <mat-icon aria-hidden="true">delete</mat-icon>
          Eliminar tarifa
        </button>
      </div>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" class="button-plain" (click)="onCancel()">Cancelar</button>
  <button type="button" class="button-stamp" [disabled]="!form.valid" (click)="onSave()">
    {{ data.rate ? 'Guardar' : 'Crear' }}
  </button>
</mat-dialog-actions>
