<div class="dialog-header">
  <button type="button" class="dialog-close" aria-label="Cerrar" (click)="onCancel()">
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
  <h2 mat-dialog-title>Mano de obra de {{ data.recipeType.name }}</h2>
</div>
<mat-dialog-content>
  <form [formGroup]="form">
    <h3 class="section-title">Cuánto tiempo lleva</h3>

    <ul formArrayName="items" class="items-list">
      @for (item of itemsArray.controls; track $index) {
        <li [formGroupName]="$index" class="item-row">
          <label class="field">
            <span class="field-label">Consumo</span>
            <span class="field-line">
              <select class="field-select" formControlName="consumptionId">
                @for (consumption of availableConsumptions($index); track consumption.id) {
                  <option [value]="consumption.id">
                    {{ consumption.name }} ({{ getCostName(consumption.rateId) }})
                  </option>
                }
              </select>
            </span>
          </label>

          <div class="item-time">
            <label class="field">
              <span class="field-label">Horas</span>
              <span class="field-line">
                <input class="field-input" type="number" min="0" step="1" inputmode="numeric"
                       formControlName="hours">
              </span>
            </label>

            <label class="field">
              <span class="field-label">Minutos</span>
              <span class="field-line">
                <input class="field-input" type="number" min="0" max="59" step="1"
                       inputmode="numeric" formControlName="minutes">
              </span>
            </label>

            <button type="button"
                    class="item-remove"
                    [disabled]="itemsArray.length === 1"
                    [attr.aria-label]="'Quitar consumo ' + ($index + 1)"
                    (click)="removeItem($index)">
              <mat-icon aria-hidden="true">delete</mat-icon>
            </button>
          </div>
        </li>
      }
    </ul>

    <button type="button" class="add-line" (click)="addItem()">
      <mat-icon aria-hidden="true">add</mat-icon>
      Agregar consumo
    </button>

    @if (data.labor) {
      <div class="danger-zone">
        <button type="button" class="button-outline is-destructive" (click)="onDelete()">
          <mat-icon aria-hidden="true">delete</mat-icon>
          Eliminar mano de obra
        </button>
      </div>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" class="button-plain" (click)="onCancel()">Cancelar</button>
  <button type="button" class="button-stamp" [disabled]="!form.valid" (click)="onSave()">
    Guardar
  </button>
</mat-dialog-actions>
